name: Publish (npm provenance)

# Publishes every package whose version is not on npm yet: the workspaces and
# the standalone lacspace-* tools. Each one is built and tested first, then
# published with an npm provenance attestation, which shows the verified
# "Built and signed on GitHub Actions" badge on npmjs.com.
#
# Runs on its own when a package.json changes on main, which is what a version
# bump does. Nothing is published when every version is already live.
# Manual runs (Actions tab) can dry-run, rehearse, or limit to some packages.
#
# Setup: repo secret NPM_TOKEN holds an npm token with publish rights.
# All logic lives in scripts/publish-pending.mjs, which also runs locally.

on:
  push:
    branches: [main]
    paths: ["*/package.json"]
  workflow_dispatch:
    inputs:
      mode:
        description: "publish = release pending versions · dry-run = everything but the upload · rehearse = build, test and pack even if already live"
        type: choice
        options: [publish, dry-run, rehearse]
        default: publish
      only:
        description: "Comma-separated package names or folders (blank = all)"
        required: false
        default: ""

permissions:
  contents: read
  id-token: write # signs the provenance attestation (OIDC)

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install workspaces
        run: npm ci --no-audit --no-fund

      - name: Publish pending packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          MODE: ${{ inputs.mode }}
          ONLY: ${{ inputs.only }}
        run: |
          ARGS=(--publish)
          [ "$MODE" = "dry-run" ] && ARGS+=(--dry-run)
          [ "$MODE" = "rehearse" ] && ARGS=(--rehearse)
          [ -n "$ONLY" ] && ARGS+=(--only "$ONLY")
          node scripts/publish-pending.mjs "${ARGS[@]}"
